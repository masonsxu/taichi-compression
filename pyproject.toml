[project]
name = "taichi-compress"
version = "0.1.0"
description = "太极压缩 (TaiChi Compression)：LLM 概率预测 + 算术编码的无损文本压缩"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
taichi-compress = "taichi_compress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taichi_compress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
